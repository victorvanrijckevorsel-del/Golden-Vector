version: 1
default_top_n: 10
min_criteria_fraction: 0.67
criteria:
  - id: down_beta
    label: Down beta
    description: Gold downside sensitivity.
    source_field: down_beta_core
    group: Gold Sensitivity
    default_direction: high_good
    unit: beta
    available_now: true
  - id: up_beta
    label: Up beta
    description: Gold upside sensitivity.
    source_field: up_beta_core
    group: Gold Sensitivity
    default_direction: high_good
    unit: beta
    available_now: true
  - id: gold_beta_core
    label: Gold beta
    description: Overall gold-linked movement.
    source_field: structural_delta_core
    group: Gold Sensitivity
    default_direction: high_good
    unit: beta
    available_now: true
  - id: downside_volatility
    label: Downside volatility
    description: Drawdown size in weak periods.
    source_field: downside_volatility_52w
    group: Gold Sensitivity
    default_direction: high_good
    unit: percent
    available_now: true
  - id: confidence
    label: Model confidence
    description: Historical model fit.
    source_field: confidence_score
    group: Gold Sensitivity
    default_direction: high_good
    unit: score
    available_now: true
  - id: aisc
    label: AISC
    description: All-in cost to mine one ounce.
    source_field: aisc_usd_per_oz
    group: Corporate Finance
    default_direction: low_good
    unit: usd_per_oz
    available_now: true
  - id: leverage
    label: Net Debt / EBITDA
    description: Debt load vs earnings.
    source_field: leverage
    group: Corporate Finance
    default_direction: low_good
    unit: multiple
    available_now: true
  - id: ev_ebitda
    label: EV/EBITDA
    description: Price vs forward earnings power.
    source_field: ev_ebitda
    group: Corporate Finance
    default_direction: low_good
    unit: multiple
    available_now: true
  - id: forward_pe
    label: Forward P/E
    description: Price vs estimated profit.
    source_field: forward_pe
    group: Corporate Finance
    default_direction: low_good
    unit: multiple
    available_now: true
  - id: aisc_margin_yield
    label: AISC margin yield
    description: Margin above reported AISC per dollar of share price (cost proxy, not audited cash flow).
    source_field: aisc_margin_yield
    group: Corporate Finance
    default_direction: high_good
    unit: percent
    available_now: true
  - id: margin_pct
    label: Margin %
    description: Profit cushion per ounce vs the gold price.
    source_field: margin_pct
    group: Corporate Finance
    default_direction: high_good
    unit: percent
    available_now: true
  - id: reserve_life
    label: Reserve life
    description: Years of mine life remaining.
    source_field: reserve_life_years
    group: Corporate Finance
    default_direction: high_good
    unit: years
    available_now: true
  - id: market_cap
    label: Market cap
    description: Company size by equity value.
    source_field: market_cap_musd
    group: Corporate Finance
    default_direction: high_good
    unit: musd
    available_now: true
  - id: interest_cover_gold
    label: Interest-cover gold
    description: Gold price where profit only just covers interest payments; missing can mean no material debt.
    source_field: interest_cover_gold_usd
    group: Corporate Resilience
    default_direction: low_good
    unit: usd_per_oz
    available_now: true
  - id: debt_stress_gold
    label: Debt-stress gold
    description: Gold price where debt becomes heavy vs earnings; missing can mean no material debt.
    source_field: debt_stress_gold_usd
    group: Corporate Resilience
    default_direction: low_good
    unit: usd_per_oz
    available_now: true
  - id: cost_curve
    label: Cost curve percentile
    description: Cost position vs peers (same ranking as AISC).
    source_field: cost_curve_aisc_percentile
    group: Corporate Resilience
    default_direction: low_good
    unit: percentile
    available_now: true
  - id: iv_percentile
    label: IV percentile
    description: Option price level vs peers.
    source_field: iv_percentile_cross_sectional
    group: Options
    default_direction: low_good
    unit: percentile
    available_now: true
  - id: iv_skew
    label: Skew vs benchmark
    description: How much richer this stock's downside puts are priced versus its sector benchmark ETF (GDX/GDXJ). Same number as the Option Trading page.
    source_field: skew_residual_signal
    group: Options
    default_direction: high_good
    unit: percent
    available_now: true
  - id: name_iv_skew
    label: Own put/call skew
    description: The stock's own put-minus-call IV skew, without the benchmark comparison. Answers a different question than skew vs benchmark.
    source_field: name_iv_skew_signal
    group: Options
    default_direction: high_good
    unit: percent
    available_now: true
  - id: tool_c_downside_rank
    label: Downside composite score
    description: Blended 0-100 percentile score of how the stock behaves when gold sells off (advanced; combines several downside measures). Higher is better, not an ordinal rank.
    source_field: tool_c_downside_rank
    group: Advanced Composites
    default_direction: high_good
    unit: percentile
    available_now: true
  - id: tool_c_upside_rank
    label: Upside composite score
    description: Blended 0-100 percentile score of how the stock behaves when gold rallies (advanced; combines several upside measures). Higher is better, not an ordinal rank.
    source_field: tool_c_upside_rank
    group: Advanced Composites
    default_direction: high_good
    unit: percentile
    available_now: true
  - id: tool_d_quality_rank
    label: Resilience composite score
    description: Blended 0-100 resilience percentile score from survival, cost, fragility and balance-sheet components (advanced). Higher is better, not an ordinal rank.
    source_field: tool_d_quality_rank
    group: Advanced Composites
    default_direction: high_good
    unit: percentile
    available_now: true
presets:
  - id: bull
    label: Bull
    description: Cheap, financially solid names to own if gold rises; ranks quality first, not rally torque.
    options_side: none
    criteria:
      - id: aisc_margin_yield
        direction: high_good
        weight: 1.0
      - id: aisc
        direction: low_good
        weight: 1.0
      - id: leverage
        direction: low_good
        weight: 1.0
      - id: ev_ebitda
        direction: low_good
        weight: 1.0
      - id: forward_pe
        direction: low_good
        weight: 1.0
      - id: reserve_life
        direction: high_good
        weight: 1.0
      - id: up_beta
        direction: high_good
        weight: 0.5
  - id: bear
    label: Bear
    description: Fragile names likely to fall hardest if gold falls.
    options_side: none
    # Intentional fragility overrides: for Bear, higher cost, higher debt,
    # and lower cash-flow strength can identify names with more downside stress.
    criteria:
      - id: down_beta
        direction: high_good
        weight: 1.0
      - id: aisc
        direction: high_good
        weight: 1.0
      - id: leverage
        direction: high_good
        weight: 1.0
      - id: aisc_margin_yield
        direction: low_good
        weight: 1.0
      - id: reserve_life
        direction: low_good
        weight: 1.0
      - id: interest_cover_gold
        direction: high_good
        weight: 1.0
      - id: debt_stress_gold
        direction: high_good
        weight: 1.0
      - id: iv_percentile
        direction: low_good
        weight: 0.5
      - id: confidence
        direction: high_good
        weight: 0.5
