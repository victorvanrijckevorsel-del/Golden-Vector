version: 1
default_top_n: 10
min_criteria_fraction: 0.67
criteria:
  - id: down_beta
    label: Down-beta
    source_field: down_beta_core
    group: Gold Sensitivity
    default_direction: high_good
    unit: beta
    available_now: true
  - id: up_beta
    label: Up-beta
    source_field: up_beta_core
    group: Gold Sensitivity
    default_direction: high_good
    unit: beta
    available_now: true
  - id: gold_beta_core
    label: Gold beta (core)
    source_field: structural_delta_core
    group: Gold Sensitivity
    default_direction: high_good
    unit: beta
    available_now: true
  - id: downside_volatility
    label: Downside volatility
    source_field: downside_volatility_52w
    group: Gold Sensitivity
    default_direction: high_good
    unit: percent
    available_now: true
  - id: confidence
    label: Confidence
    source_field: confidence_score
    group: Gold Sensitivity
    default_direction: high_good
    unit: score
    available_now: true
  - id: aisc
