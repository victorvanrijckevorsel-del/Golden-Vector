    default_direction: low_good
    unit: multiple
    available_now: true
  - id: ev_ebitda
    label: EV/EBITDA
    source_field: ev_ebitda
    group: Corporate Finance
    default_direction: low_good
    unit: multiple
    available_now: true
  - id: forward_pe
    label: Forward P/E
    source_field: forward_pe
    group: Corporate Finance
    default_direction: low_good
    unit: multiple
    available_now: true
  - id: fcf_yield
    label: FCF yield
    source_field: fcf_yield
    group: Corporate Finance
    default_direction: high_good
    unit: percent
    available_now: true
  - id: margin_pct
    label: Margin %
    source_field: margin_pct
    group: Corporate Finance
    default_direction: high_good
    unit: percent
    available_now: true
  - id: fundamental_check_score
    label: Fundamental checks
    source_field: fundamental_check_score
    group: Corporate Finance
    default_direction: high_good
    unit: score
    available_now: true
  - id: reserve_life
    label: Reserve life
    source_field: reserve_life_years
    group: Corporate Finance
    default_direction: high_good
    unit: years
    available_now: true
  - id: market_cap
    label: Market cap
    source_field: market_cap_musd
    group: Corporate Finance
    default_direction: high_good
    unit: musd
    available_now: true
  - id: iv_percentile
    label: IV percentile
    source_field: iv_percentile_cross_sectional
    group: Options
    default_direction: low_good
    unit: percentile
    available_now: true
  - id: iv_skew
    label: IV skew
    source_field: iv_skew_60d
    group: Options
    default_direction: high_good
    unit: percent
    available_now: true
  - id: tool_c_downside_rank
    label: Gold Downside downside rank
    source_field: tool_c_downside_rank
    group: Gold Downside
    default_direction: high_good
    unit: percentile
    available_now: true
  - id: tool_c_upside_rank
    label: Gold Downside upside rank
    source_field: tool_c_upside_rank
    group: Gold Downside
    default_direction: high_good
    unit: percentile
    available_now: true
  - id: tool_d_quality_rank
    label: Corporate Resilience quality rank
    source_field: tool_d_quality_rank
    group: Corporate Resilience
    default_direction: high_good
    unit: percentile
    available_now: true
presets:
  - id: strong_corporate_finance
    label: Strong Corporate Finance
    options_side: none
    criteria:
      - id: fundamental_check_score
        direction: high_good
        weight: 1.0
      - id: aisc
        direction: low_good
        weight: 1.0
      - id: leverage
        direction: low_good
        weight: 1.0
      - id: fcf_yield
        direction: high_good
        weight: 1.0
      - id: margin_pct
        direction: high_good
        weight: 1.0
      - id: ev_ebitda
        direction: low_good
        weight: 1.0
      - id: forward_pe
        direction: low_good
        weight: 1.0
  - id: bearish_put
    label: Bearish put screen
    options_side: puts
    # Intentional fragility overrides: for bearish puts, higher AISC and
    # higher leverage can be useful because they amplify downside stress.
    criteria:
      - id: down_beta
        direction: high_good
        weight: 1.0
      - id: aisc
        direction: high_good
        weight: 1.0
      - id: leverage
        direction: high_good
        weight: 1.0
      - id: iv_percentile
        direction: low_good
        weight: 1.0
      - id: confidence
        direction: high_good
        weight: 1.0
      - id: tool_c_downside_rank
        direction: high_good
        weight: 1.0
      - id: tool_d_quality_rank
        direction: low_good
        weight: 1.0
  - id: bullish_call
    label: Bullish call screen
    options_side: calls
    criteria:
      - id: up_beta
        direction: high_good
        weight: 1.0
      - id: aisc
        direction: low_good
        weight: 1.0
      - id: fcf_yield
        direction: high_good
        weight: 1.0
      - id: margin_pct
        direction: high_good
        weight: 1.0
      - id: ev_ebitda
        direction: low_good
        weight: 1.0
      - id: forward_pe
        direction: low_good
        weight: 1.0
      - id: fundamental_check_score
        direction: high_good
        weight: 1.0
      - id: iv_percentile
        direction: low_good
        weight: 1.0
      - id: tool_c_upside_rank
        direction: high_good
        weight: 1.0
      - id: tool_d_quality_rank
        direction: high_good
        weight: 1.0
